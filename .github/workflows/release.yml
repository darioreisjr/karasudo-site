name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publicar:
    name: Publicar Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Conferir sincronia dos agentes e MCP
        run: npm run ai:check

      - name: Validar integridade da documentacao da Wiki
        run: npm run wiki:check

      - name: Auditoria de layout, textos e pixel art
        run: npm run audit

      - name: Build de produção estático
        run: npm run build

      - name: Publicar release se houver nova versão
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          npm run release -- --if-needed
